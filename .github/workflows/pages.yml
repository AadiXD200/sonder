# Publish the site/ directory to GitHub Pages.
#
# The build is NOT run here. scripts/site.sh needs ~100 MB of registrar scrape
# intermediates in .cache/, which are not in the repo and would mean hammering
# the timetable API on every push. So the split is deliberate:
#
#   main      source only, no build output
#   gh-pages  the built site/, produced locally by ./scripts/deploy.sh
#
# This workflow only uploads what is already there. Deploys are a file copy,
# and the data refresh stays a deliberate monthly act rather than a side
# effect of editing CSS.
name: Deploy site

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
