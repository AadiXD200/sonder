<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sonder · Mobile preview</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #e5e2d8; color: #14140f; font: 14px/1.5 ui-monospace, monospace; }
      header { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 12px; flex-wrap: wrap; }
      h1 { font-size: 14px; margin: 0; }
      select, a { font: inherit; color: inherit; }
      select { min-height: 44px; padding: 0 10px; border: 1px solid #aaa697; background: #f3f0e7; }
      a { padding: 10px 0; }
      main { padding: 0 10px 20px; }
      iframe { display: block; width: 390px; max-width: 100%; height: 844px; margin: auto; border: 2px solid #14140f; background: #f3f0e7; box-shadow: 8px 8px 0 #14140f20; }
    </style>
  </head>
  <body>
    <header>
      <h1>Sonder · Mobile preview</h1>
      <label>Screen <select id="screen-size"><option value="390,844">390 × 844</option><option value="320,568">320 × 568 · Small phone</option><option value="375,667">375 × 667</option><option value="430,932">430 × 932 · Large phone</option><option value="844,390">844 × 390 · Landscape</option></select></label>
      <a href="./explore.html" target="_blank" rel="noopener">Open full page ↗</a>
    </header>
    <main><iframe id="phone" title="Interactive Sonder mobile preview" src="./explore.html" allow="clipboard-write; geolocation; web-share"></iframe></main>
    <script>
      const phone = document.getElementById('phone');
      document.getElementById('screen-size').addEventListener('change', event => {
        const [width, height] = event.target.value.split(',');
        phone.style.width = `${Number(width) + 4}px`;
        phone.style.height = `${Number(height) + 4}px`;
      });
      phone.style.width = '394px';
      phone.style.height = '848px';
    </script>
  </body>
</html>
